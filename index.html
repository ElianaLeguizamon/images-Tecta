<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>TECTA - The myths of Chinese roofs</title>
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Adamina:wght@400&display=swap" />
  </head>
  <body>
    <div class="desktop-9">
      <img
        class="desktop-9-child"
        loading="lazy"
        alt=""
        src="./images/Rectangle-2.svg"
      />

      <section class="desktop-92">
        <div class="desktop-93">
          <div class="vector-parent">
            <img
              class="frame-child"
              loading="lazy"
              alt="TECTA Leaf Logo"
              src="./images/Ellipse-1.svg"
            />

            <nav class="home-parent">
              <div class="home">Home</div>
              <div class="home">Designs</div>
              <button class="auth-container" type="button">
                <div class="sign-up">Sign up</div>
              </button>
            </nav>
          </div>
          <h1 class="tecta">TECTA</h1>
        </div>
      </section>

      <!-- Central Hero Stage (Oval, Strings, Roof) scaled proportionally -->
      <div class="hero-center-stage">
        <img
          class="copilot-20260917-102901-1-icon"
          alt="Textured Oval Shape"
          src="./images/Copilot-20260917-102901-1@2x.png"
        />

        <!-- Physics strings container sits behind roof asset -->
        <div id="container" class="curtain-container"></div>

        <img
          id="main-roof"
          class="copilot-20260917-103956-1-icon"
          alt="Main Roof"
          src="./images/Copilot-20260917-103956-1@2x.png"
        />
      </div>

      <!-- Selector lateral de techos -->
      <div class="roof-selector-controls">
        <!-- Techo lateral izquierdo -->
        <button type="button" class="roof-thumb-btn btn-left" id="btn-roof-left" aria-label="Seleccionar techo lateral izquierdo">
          <img
            class="thumb-img"
            loading="lazy"
            alt="Techo Lateral Izquierdo"
            src="./images/Frame 1367 (1).png"
          />
        </button>

        <!-- Techo lateral derecho -->
        <button type="button" class="roof-thumb-btn btn-right" id="btn-roof-right" aria-label="Seleccionar techo lateral derecho">
          <img
            class="thumb-img"
            loading="lazy"
            alt="Techo Lateral Derecho"
            src="./images/Frame 1365 (1).png"
          />
        </button>
      </div>

      <section class="featuring-the-iconic-double-ea-parent">
        <div id="article-desc" class="featuring-the-iconic">
          Featuring the iconic double-eaved xieshan hip-and-gable roof, glazed
          golden tiles, and red-painted wooden brackets. Every curve and
          upturned corner was designed to ward off evil spirits and shelter
          imperial majesty.
        </div>
        <div class="article-container">
          <div class="the-myths-of-chinese-roofs-parent">
            <h1 id="article-title" class="the-myths-of">The myths of Chinese roofs</h1>
            <div class="frame-item"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Interactive text strings simulation -->
    <script src="./script.js"></script>
  </body>
</html>
