<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>TECTA - The myths of Chinese roofs</title>
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Adamina:wght@400&display=swap" />
  </head>
  <body>
    <div class="desktop-9">
      <img
        class="desktop-9-child"
        loading="lazy"
        alt=""
        src="./Rectangle-2.svg"
      />

      <section class="desktop-92">
        <div class="desktop-93">
          <div class="vector-parent">
            <img
              class="frame-child"
              loading="lazy"
              alt="TECTA Leaf Logo"
              src="./Ellipse-1.svg"
            />

            <nav class="home-parent">
              <div class="home">Home</div>
              <div class="home">Designs</div>
              <button class="auth-container" type="button">
                <div class="sign-up">Sign up</div>
              </button>
            </nav>
          </div>
          <h1 class="tecta">TECTA</h1>
        </div>
      </section>

      <!-- Central Hero Stage (Oval, Strings, Roof) scaled proportionally -->
      <div class="hero-center-stage">
        <img
          class="copilot-20260917-102901-1-icon"
          alt="Textured Oval Shape"
          src="./Copilot-20260917-102901-1@2x.png"
        />

        <!-- Physics strings container sits behind roof asset -->
        <div id="container"></div>

        <img
          class="copilot-20260917-103956-1-icon"
          alt="Chinese Architectural Roof"
          src="./Copilot_20260917_103956 1 (1).png"
          onerror="this.src='./Copilot-20260917-103956-1@2x.png'"
        />
      </div>

      <section class="featuring-the-iconic-double-ea-parent">
        <div class="featuring-the-iconic">
          Featuring the iconic double-eaved xieshan hip-and-gable roof, glazed
          golden tiles, and red-painted wooden brackets. Every curve and
          upturned corner was designed to ward off evil spirits and shelter
          imperial majesty.
        </div>
        <div class="article-container">
          <div class="the-myths-of-chinese-roofs-parent">
            <h1 class="the-myths-of">The myths of Chinese roofs</h1>
            <div class="frame-item"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Interactive text strings simulation -->
    <script src="script.js?v=liam_egan_original_v11"></script>
  </body>
</html>
